
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arabic Image Captioning</title>
<style>
body{margin:0;font-family:Arial;background:#f1f5f9;color:#1e293b}
header{background:#1e3a8a;color:white;text-align:center;padding:30px}
.container{max-width:650px;margin:50px auto;padding:20px}
.card{background:white;padding:35px;border-radius:15px;text-align:center;box-shadow:0 5px 20px #0001}
input{margin:20px 0}
button{background:#2563eb;color:white;border:0;padding:14px 25px;border-radius:8px;cursor:pointer}
button:hover{background:#1d4ed8}
.result{background:#eff6ff;padding:20px;border-radius:10px;margin-top:25px;text-align:left}
.result h3{color:#1e40af}
a{display:block;margin-top:25px;color:#2563eb;text-decoration:none}
#preview{display:none;max-width:100%;width:300px;margin:15px auto;border-radius:10px}
.result-image{display:block;max-width:100%;width:350px;margin:15px auto;border-radius:10px}
</style>
</head>
<body>
<header>
<h1>Arabic Image Captioning</h1>
<p>Generate Arabic descriptions using AI</p>
</header>

<div class="container">
<div class="card">
<h2>Upload Your Image</h2>

<form action="/caption" method="POST" enctype="multipart/form-data">
<input type="file" name="image" accept="image/*" required>

<img id="preview" alt="Selected image preview">

<div>
<button type="submit">Generate Caption</button>
</div>
</form>

{% if english %}
<div class="result">
<h3>Uploaded Image</h3>
<img class="result-image" src="data:{{image_type}};base64,{{image_data}}" alt="Uploaded image">

<h3>English Caption</h3>
<p>{{english}}</p>

<h3>Arabic Caption</h3>
<p dir="rtl" lang="ar">{{arabic}}</p>
</div>
{% endif %}

<a href="/">Back to Home</a>
</div>
</div>

<script>
const input=document.querySelector('input[name="image"]');
const preview=document.getElementById("preview");

input.addEventListener("change",function(){
    const file=this.files[0];

    if(file){
        preview.src=URL.createObjectURL(file);
        preview.style.display="block";
    }else{
        preview.removeAttribute("src");
        preview.style.display="none";
    }
});
</script>
</body>
</html>
