
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arabic AI Education Assistant</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b}
header{background:#1e3a8a;color:white;text-align:center;padding:45px 15px}
header h1{margin:0 0 12px}
main{max-width:850px;margin:60px auto;padding:20px}
.container{display:flex;gap:25px;justify-content:center;flex-wrap:wrap}
.card{background:white;padding:35px;border-radius:15px;width:300px;text-align:center;box-shadow:0 5px 20px #0001}
.card h2{color:#1e40af}
.card p{color:#64748b;line-height:1.6}
button{background:#2563eb;color:white;border:0;padding:14px 25px;border-radius:8px;cursor:pointer;font-size:15px}
button:hover{background:#1d4ed8}
footer{text-align:center;color:#64748b;padding:30px}
</style>
</head>
<body>
<header>
<h1>Arabic AI Education Assistant</h1>
<p>AI-Powered Learning and Evaluation Platform</p>
</header>
<main>
<div class="container">
<div class="card">
<h2>Image Captioning</h2>
<p>Upload an image and generate an AI-powered Arabic description.</p>
<a href="/caption"><button>Open Captioning</button></a>
</div>
<div class="card">
<h2>Answer Evaluation</h2>
<p>Evaluate Arabic student answers using AI-based semantic similarity.</p>
<a href="/evaluation"><button>Open Evaluation</button></a>
</div>
</div>
</main>
<footer>Arabic AI Education Assistant</footer>
</body>
</html>
