
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Answer Evaluation</title>
<style>
body{margin:0;font-family:Arial;background:#f1f5f9;color:#1e293b}
header{background:#1e3a8a;color:white;text-align:center;padding:30px}
.container{max-width:650px;margin:50px auto;padding:20px}
.card{background:white;padding:35px;border-radius:15px;box-shadow:0 5px 20px #0001}
h2{text-align:center;color:#1e40af}
.question{background:#eff6ff;padding:20px;border-radius:10px;font-size:18px}
textarea{width:100%;box-sizing:border-box;padding:15px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;resize:vertical}
button{background:#2563eb;color:white;border:0;padding:14px;border-radius:8px;cursor:pointer;margin-top:20px;width:100%}
button:hover{background:#1d4ed8}
.result{background:#eff6ff;padding:25px;border-radius:10px;text-align:center;margin-top:25px}
.score{font-size:36px;color:#1d4ed8;font-weight:bold}
a{display:block;text-align:center;margin-top:25px;color:#2563eb;text-decoration:none}
</style>
</head>
<body>
<header>
<h1>Arabic Answer Evaluation</h1>
<p>Student Assessment Portal</p>
</header>
<div class="container">
<div class="card">
<h2>Student Section</h2>
<h3>Question</h3>
<div class="question" dir="rtl" lang="ar">{{question}}</div>
<form action="/evaluate" method="POST">
<input type="hidden" name="question" value="{{question}}">
<input type="hidden" name="reference" value="{{reference}}">
<h3>Your Answer</h3>
<textarea name="answer" rows="4" dir="rtl" lang="ar" required>{{answer or ""}}</textarea>
<button type="submit">Evaluate Answer</button>
</form>
{% if score is defined %}
<div class="result">
<h2>Evaluation Result</h2>
<p>Your Score</p>
<div class="score">{{score}}/10</div>
</div>
{% endif %}
<a href="/evaluation">Back to Teacher Section</a>
<a href="/">Back to Home</a>
</div>
</div>
</body>
</html>
